<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Gradient</p>
      <h1>Verdes pixel art que siguen tu cursor</h1>
      <p class="lede">Fondo 8-bit con verdes profundos y acentos terracota/naranja que se mueven con tu cursor y un halo animado alrededor del punto.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
