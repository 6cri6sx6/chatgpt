<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <div id="grid-overlay" aria-hidden="true"></div>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Gradient</p>
      <h1>Degradado en cajas que sigue el cursor</h1>
      <p class="lede">
        Fondo pixel art inspirado en el grid de cajas: un degradado con tus tonos verdes y terracota que se mueve
        con el cursor y un brillo sutil alrededor del círculo.
      </p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
