<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Art Gradient</p>
      <h1>Fondo que sigue el cursor</h1>
      <p class="lede">Caja inspirada en background boxes: rejilla de píxeles con gradiente que se pega al cursor, onda suave y halo casi imperceptible en tu paleta.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
