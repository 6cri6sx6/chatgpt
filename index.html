<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Art Boxes</p>
      <h1>Glow que sigue el cursor</h1>
      <p class="lede">Versión pixel art del fondo de burbujas: celdas pequeñas, blobs diminutos que se pegan y juegan entre sí, y un halo suave que sigue tu cursor.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
