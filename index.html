<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Art Boxes</p>
      <h1>Glow que sigue el cursor</h1>
      <p class="lede">Tres blobs en gradiente con tu paleta (verdes y terracota), pegajosos pero discretos, con un brillo pixelado que sigue al cursor sin robar protagonismo.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
