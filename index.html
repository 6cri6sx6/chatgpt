<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pixel Art Reactivo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="pixel-canvas" aria-hidden="true"></canvas>
  <main class="hero">
    <div class="halo-mask" aria-hidden="true"></div>
    <div class="hero__content">
      <p class="eyebrow">Pixel Art Gradient</p>
      <h1>Degradado que sigue el cursor</h1>
      <p class="lede">Un fondo en pixel art con tres tonos (verde oscuro, verde medio y terracota) que ondula suavemente, se desplaza por la pantalla y se concentra alrededor del círculo del cursor.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
